<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yellowstone Trip Itinerary</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet-fullscreen/2.4.0/Control.FullScreen.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-fullscreen/2.4.0/Control.FullScreen.min.js"></script>
    <style>
        @keyframes drawLine {
            from {
                stroke-dashoffset: 1000;
            }
            to {
                stroke-dashoffset: 0;
            }
        }
        @keyframes pulse-marker {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.15);
            }
        }
        .animated-route {
            stroke-dasharray: 1000;
            animation: drawLine 3s ease-in-out forwards;
        }
        .pulse-marker {
            animation: pulse-marker 2s ease-in-out infinite;
        }
        #map {
            border-radius: 1rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }
        .leaflet-control-attribution {
            background-color: rgba(255, 255, 255, 0.9) !important;
            border-color: rgba(200, 200, 200, 1) !important;
            color: rgba(80, 80, 80, 1) !important;
        }
        .leaflet-control-zoom {
            border-radius: 0.75rem !important;
            background-color: rgba(255, 255, 255, 0.95) !important;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2) !important;
        }
        .leaflet-control-zoom-in, .leaflet-control-zoom-out {
            border: 1px solid rgba(200, 200, 200, 1) !important;
            color: rgba(59, 130, 246, 1) !important;
            background-color: rgba(255, 255, 255, 0.95) !important;
            font-weight: bold !important;
        }
        .leaflet-control-zoom-in:hover, .leaflet-control-zoom-out:hover {
            background-color: rgba(240, 240, 240, 0.95) !important;
        }
        .leaflet-fullscreen-button {
            border-radius: 0.5rem !important;
            background-color: rgba(255, 255, 255, 0.95) !important;
            border: 1px solid rgba(200, 200, 200, 1) !important;
        }
        .leaflet-fullscreen-button:hover {
            background-color: rgba(240, 240, 240, 0.95) !important;
        }
        #map.fullscreen-map {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 9999;
            border-radius: 0;
        }
        #floatingDayBar {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10000;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 1rem;
            border: 1px solid rgba(200, 200, 200, 1);
            padding: 1rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.15);
            display: none;
            max-width: 90vw;
            overflow-x: auto;
        }
        #floatingDayBar.active {
            display: block;
        }
        .floating-day-btn {
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            border: 1px solid rgba(200, 200, 200, 1);
            background: rgba(255, 255, 255, 0.8);
            color: rgba(80, 80, 80, 1);
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .floating-day-btn:hover {
            background: rgba(230, 230, 230, 0.9);
        }
        .floating-day-btn.active {
            background: rgba(59, 130, 246, 0.2);
            border-color: rgba(59, 130, 246, 1);
            color: rgba(59, 130, 246, 1);
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen font-sans antialiased selection:bg-amber-500 selection:text-gray-900">

    <header class="sticky top-0 z-50 bg-gray-900/90 backdrop-blur-md border-b border-gray-800 execution-layer">
        <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-mountain-sun text-amber-500 text-2xl"></i>
                <span class="font-bold text-lg tracking-wider uppercase text-gray-100">Yellowstone 2026</span>
            </div>
            <div class="flex items-center space-x-2 text-sm bg-gray-800 px-3 py-1.5 rounded-full border border-gray-700">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                <span class="text-gray-300 font-medium">Trip Confirmed</span>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-8 space-y-8">
        
        <section class="relative rounded-3xl overflow-hidden bg-gradient-to-br from-amber-600 via-amber-700 to-amber-900 shadow-2xl p-6 md:p-10 text-white">
            <div class="absolute inset-0 bg-black/20 mix-blend-multiply"></div>
            <div class="relative z-10 flex flex-col md:flex-row justify-between items-start md:items-center gap-6">
                <div>
                    <p class="text-xs font-bold tracking-widest uppercase text-amber-200 mb-1">July 05 – July 11, 2026</p>
                    <h1 class="text-3xl md:text-5xl font-black tracking-tight mb-2">The Grand Adventure</h1>
                    <p class="text-amber-100/90 text-sm md:text-base max-w-xl">4 Travelers • Outbound via Delta • Inbound via Southwest • Full Ground Transit Secured via Hertz SUV</p>
                </div>
            </div>
        </section>

        <section class="relative rounded-3xl overflow-hidden bg-gray-800 border border-gray-700 shadow-2xl p-6 md:p-8">
            <div class="flex items-center justify-between mb-6">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-lg bg-amber-500/10 text-amber-400 flex items-center justify-center"><i class="fa-solid fa-calendar-days text-lg"></i></div>
                    <div>
                        <h2 class="font-bold text-lg tracking-tight text-gray-100">Day-by-Day Journey</h2>
                        <p class="text-xs text-gray-400 mt-0.5">Click a day to see your movement and activities on the map</p>
                    </div>
                </div>
                <button id="resetMapBtn" class="px-4 py-2 bg-amber-500/10 text-amber-400 text-xs font-bold rounded-lg border border-amber-500/30 hover:bg-amber-500/20 transition-colors flex items-center gap-2
